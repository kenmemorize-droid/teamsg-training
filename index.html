<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>Team SG Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#1B2A41; --muted:#5B6575; --line:#DDE1E6; --field:#FFFFFF;
  --green:#1F5E4A; --on-green:#FFFFFF; --green-soft:#E8F0EC;
  --red:#C8102E; --red-soft:#FBE7EA; --red-ink:#A50D24;
  --gold:#C9A227; --gold-soft:#F6EFD6; --gold-ink:#6B5410;
  --hero:#1B2A41; --hero-ink:#FFFFFF; --hero-muted:#C9D1DC;
  --heat0:#E4E8EE; --heat1:#C4DACF; --heat2:#6E9F88; --heat3:#1F5E4A; --heat-ink-dark:#1B2A41; --heat-ink-light:#FFFFFF;
  --err1:#F5C6CD; --err1-ink:#1B2A41; --err2:#E07A88; --err2-ink:#1B2A41; --err3:#A50D24; --err3-ink:#FFFFFF;
  --num:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body:'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1520; --surface:#172131; --ink:#E8ECF1; --muted:#A3ADBB; --line:#2A3647; --field:#111A27;
    --green:#4FBF93; --on-green:#0E1520; --green-soft:#183A30;
    --red:#FF6B7D; --red-soft:#3A1A20; --red-ink:#FF9AA6;
    --gold:#D9B441; --gold-soft:#3A3115; --gold-ink:#E9CF7A;
    --hero:#172131; --hero-ink:#E8ECF1; --hero-muted:#A3ADBB;
    --heat0:#223044; --heat1:#24493D; --heat2:#2F7A5F; --heat3:#4FBF93; --heat-ink-dark:#E8ECF1; --heat-ink-light:#0E1520;
    --err1:#4A2229; --err1-ink:#E8ECF1; --err2:#8C2F3D; --err2-ink:#FFFFFF; --err3:#FF6B7D; --err3-ink:#0E1520;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1520; --surface:#172131; --ink:#E8ECF1; --muted:#A3ADBB; --line:#2A3647; --field:#111A27;
  --green:#4FBF93; --on-green:#0E1520; --green-soft:#183A30;
  --red:#FF6B7D; --red-soft:#3A1A20; --red-ink:#FF9AA6;
  --gold:#D9B441; --gold-soft:#3A3115; --gold-ink:#E9CF7A;
  --hero:#172131; --hero-ink:#E8ECF1; --hero-muted:#A3ADBB;
  --heat0:#223044; --heat1:#24493D; --heat2:#2F7A5F; --heat3:#4FBF93; --heat-ink-dark:#E8ECF1; --heat-ink-light:#0E1520;
  --err1:#4A2229; --err1-ink:#E8ECF1; --err2:#8C2F3D; --err2-ink:#FFFFFF; --err3:#FF6B7D; --err3-ink:#0E1520;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--ink)}
a:hover{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.shell{max-width:560px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.shell.wide{max-width:1040px}
.shell.bare{padding-bottom:24px}
.pad{padding:0 20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.num{font-family:var(--num);font-weight:600;letter-spacing:.01em}
h1{font-size:24px;margin:0;line-height:1.2}
h2{font-size:17px;margin:0;line-height:1.3}
.section{padding:20px 20px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.hero{background:var(--hero);color:var(--hero-ink);padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px}
.hero .meta{color:var(--hero-muted);font-size:14px}
.avatar{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:17px;flex:none;text-decoration:none;background:var(--ink);color:var(--surface)}
.hero .avatar{background:var(--hero-ink);color:var(--hero)}
.avatar.sm{width:34px;height:34px;font-size:15px}
.streak-num{font-family:var(--num);font-weight:700;font-size:96px;line-height:.85;color:var(--gold)}
.list-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row.me{background:var(--green-soft);margin:0 -10px;padding:10px;border-radius:8px;border-bottom-color:transparent}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--heat0);overflow:hidden}
.bar>span{display:block;height:8px;background:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.outline{border-color:var(--green);color:var(--green)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.big{min-height:52px;font-size:17px;width:100%}
.btn.link{border:0;background:none;padding:0 4px;min-height:44px;color:var(--ink);text-decoration:underline;font-weight:400}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px;border-radius:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;min-height:44px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--green);color:var(--ink);font-weight:700}
.hero .tabs button{color:var(--hero-muted)}
.hero .tabs button[aria-pressed="true"]{border-bottom-color:var(--gold);color:var(--hero-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:56px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;line-height:1.15;cursor:pointer;color:var(--ink)}
.tile[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.label{font-weight:700;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{min-height:48px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea.input{padding:10px 12px;resize:vertical;min-height:0}
.input.big{font-family:var(--num);font-size:22px;font-weight:600}
.input:focus{border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.unit-wrap{display:flex;align-items:center;gap:6px}
.time-in{display:grid;grid-template-columns:minmax(0,0.8fr) auto minmax(0,1.2fr) auto;align-items:center;gap:8px}
.time-in span{color:var(--muted);font-weight:600}
.unit-wrap span{color:var(--muted);white-space:nowrap}
.chipbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.code-chip{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 2px 0 10px;border-radius:16px;background:var(--red-soft);color:var(--red-ink);font-family:var(--num);font-size:18px;font-weight:700}
.code-chip button{width:30px;height:30px;border:0;border-radius:15px;background:transparent;color:var(--red-ink);font-size:18px;line-height:1;cursor:pointer}
.chipbox input{flex:1;min-width:120px;height:32px;border:0;background:transparent;outline:none}
.parse-ok{font-size:14px;color:var(--green);font-weight:600}
.parse-bad{font-size:14px;color:var(--red);font-weight:600}
.notice{padding:12px 14px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:13px;font-weight:700}
.tag.pb{background:var(--red-soft);color:var(--red-ink)}
.tag.target{background:var(--green-soft);color:var(--green)}
.tag.gold{background:var(--gold-soft);color:var(--gold-ink)}
.kudos{display:inline-flex;align-items:center;gap:5px;min-height:44px;min-width:44px;padding:0 10px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px}
.kudos[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.stat .num{font-size:32px;line-height:1;font-weight:700}
.stat .tiny{margin-top:4px}
.chart{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center}
.cal .day{height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.lv0{background:var(--heat0);color:var(--muted)}
.lv1{background:var(--heat1);color:var(--heat-ink-dark)}
.lv2{background:var(--heat2);color:var(--heat-ink-light)}
.lv3{background:var(--heat3);color:var(--heat-ink-light)}
.lvf{background:transparent;color:var(--muted)}
.today-ring{outline:2px solid var(--ink);outline-offset:-2px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;padding-top:18px}
.podium .col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.podium .block{width:100%;border-radius:6px 6px 0 0;color:#FFFFFF;display:flex;justify-content:center;padding-top:6px;font-family:var(--num);font-weight:700;font-size:26px}
.podium .val{font-family:var(--num);font-weight:700;font-size:21px;line-height:1;text-align:center}
.rank{width:22px;font-family:var(--num);font-size:20px;font-weight:700;color:var(--muted)}
.big-val{font-family:var(--num);font-size:22px;font-weight:700;white-space:nowrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabbar a{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);text-decoration:none}
.tabbar a[aria-current="page"]{color:var(--green);font-weight:700}
.tabbar svg{width:22px;height:22px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:10px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.login{max-width:420px;margin:0 auto;padding:48px 20px 24px;display:flex;flex-direction:column;gap:18px}
.wordmark{font-family:var(--num);font-weight:700;font-size:44px;line-height:.95;letter-spacing:.01em}
.wordmark span{color:var(--red)}
.demo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--green)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hscroll{overflow-x:auto}
.err{color:var(--red);font-size:14px;font-weight:600}
.field-err{color:var(--red);font-size:13px;font-weight:600}
.input.invalid,.chipbox.invalid{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.err-summary{padding:10px 14px;border-radius:10px;background:var(--red-soft);color:var(--red-ink);font-size:14px}
.err-summary ul{margin:4px 0 0;padding-left:18px}
.hero .bar{background:rgba(255,255,255,.18)}
.hero .bar>span{background:var(--gold)}
.heat{display:grid;gap:3px}
.heat button{height:32px;min-width:0;padding:0;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--num);font-size:14px;font-weight:600;cursor:pointer}
.heat button.e1{background:var(--err1);border-color:transparent;color:var(--err1-ink)}
.heat button.e2{background:var(--err2);border-color:transparent;color:var(--err2-ink)}
.heat button.e3{background:var(--err3);border-color:transparent;color:var(--err3-ink)}
.heat button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.badge.locked{border-style:dashed;background:transparent}
.badge .medal{width:36px;height:36px;border-radius:18px;background:var(--gold);color:#1B2A41;display:flex;align-items:center;justify-content:center}
.badge.locked .medal{background:var(--heat0);color:var(--muted)}
.badge .bname{font-weight:700;font-size:14px;line-height:1.2}
.flashcard{min-height:230px;border-radius:14px;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.flashcard .code{font-family:var(--num);font-weight:700;font-size:96px;line-height:1}
.flashcard .meta{color:var(--hero-muted)}
.comment{padding:10px 0;border-bottom:1px solid var(--line)}
.flag-list{margin:0;padding-left:18px;font-size:14px}
#modal[hidden]{display:none}
.eotw{width:44px;height:44px;flex:none;border-radius:10px;background:var(--gold);color:#1B2A41;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:22px}
.tile{position:relative}
.tile-tag{display:block;margin-top:3px;font-size:11px;font-weight:700;color:var(--gold-ink)}
.tile[aria-pressed="true"] .tile-tag{color:var(--gold)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.h2h .side{font-family:var(--num);font-size:20px;font-weight:600}
.h2h .win{color:var(--green);font-weight:700}
.ladder{padding:10px 0;border-bottom:1px solid var(--line)}
.ladder-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:6px}
.ladder-grid .lchip{min-width:0;padding:0 1px;font-size:12px;letter-spacing:-.01em;overflow:hidden;white-space:nowrap}
.ladder-counts{display:flex;align-items:center;gap:5px;margin-top:6px}
.lchip{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:26px;padding:0 7px;border-radius:13px;font-family:var(--num);font-size:14px;font-weight:700;color:#1B2A41}
.lchip.locked{border:1px dashed var(--line);color:var(--muted);background:transparent}
.tier-bronze{background:#E2B07E;color:#1B2A41}
.tier-silver{background:#CDD3DA;color:#1B2A41}
.tier-gold{background:#E6C65C;color:#1B2A41}
.tier-platinum{background:#BFE0EE;color:#1B2A41;box-shadow:inset 0 0 0 1px #6FA8C0}
.badge .medal{font-size:20px;line-height:1}
.info-btn{width:26px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:italic 700 14px/1 Georgia,serif;cursor:pointer;flex:none}
.info-btn[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.info-panel{margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink)}
.info-panel ul{margin:0;padding-left:18px}
.hero .info-btn{width:24px;height:24px;background:transparent;color:var(--hero-ink);border-color:var(--hero-muted)}
.info-panel li{margin:3px 0}
.collapse-head{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;text-align:left}
.proof-actions{display:flex;gap:8px;flex-wrap:wrap}
.proof-preview{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.proof-preview img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.paste-target{min-height:40px;font-size:13px;color:var(--muted)}
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.grid-inner{width:100%}
.grid-row{display:grid;grid-template-columns:46px repeat(var(--cols,10),minmax(64px,1fr));gap:4px;align-items:center;margin-top:4px;border-radius:10px}
.grid-row.me,.grid-row.me .gl{background:var(--green-soft)}
.gl{position:sticky;left:0;z-index:2;background:var(--bg);height:44px;display:flex;align-items:center;padding-left:4px;border-radius:10px 0 0 10px}
.ghead{text-align:center;font-size:11px;font-weight:700;line-height:1.1;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.ghead span:first-child{font-size:15px}
.gcell{height:44px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--num);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gcell.empty{border-style:dashed;background:transparent;color:var(--muted);font-weight:600;cursor:default}
.gcell.pending{border-style:dashed;border-color:var(--gold-ink)}
.gcell.m1,.gcell.m2,.gcell.m3{border-color:transparent;color:#1B2A41}
.gcell.m1,.grid-key i.m1{background:#EBCB5A}
.gcell.m2,.grid-key i.m2{background:#CFD5DC}
.gcell.m3,.grid-key i.m3{background:#DDA06A}
.grid-key{display:flex;gap:14px;margin-top:12px;font-size:12px;font-weight:600}
.grid-key span{display:inline-flex;align-items:center;gap:5px}
.grid-key i{width:14px;height:14px;border-radius:4px;display:inline-block}
.medal-sm{width:36px;height:36px;flex:none;border-radius:18px;display:flex;align-items:center;justify-content:center}
.recap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.modal-backdrop{position:fixed;inset:0;z-index:30;background:rgba(14,21,32,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)}

      let q = this.sb.from(table).select('*');
      if (order) q = q.order(order, { ascending: true });
      const data = this.check(await q.range(from, from + 999));
      out.push(...data); if (data.length < 1000) break;

    return out;
  }

  }

  async updateAttempt(id, patch) { return this.check(await this.sb.from('attempts').update(patch).eq('id', id).select().single()); }

    if (rows.length) this.check(await this.sb.from('attempt_errors').insert(rows.map((r) => ({ ...r, attempt_id: attemptId }))));
  }
  async insertFormat(f) { return this.check(await this.sb.from('formats').insert({ ...f, created_by: this.uid }).select().single()); }
  async updateFormat(id, patch) { this.check(await this.sb.from('formats').update(patch).eq('id', id)); }
  async deleteFormat(id) {
    const r = await this.sb.from('formats').delete().eq('id', id);
    if (r.error) throw new Error(/foreign key/i.test(r.error.message) ? 'This format is in use by attempts or targets.' : r.error.message);
  }
  async saveEms(family, kind, chunk) {
    const s = state.ems.find((x) => familyOf(x.kind) === family);

  }

const TITLES = { today: 'Today', log: 'Log attempt', progress: 'My progress', boards: 'Leaderboards', me: 'Settings', admin: 'Admin', trouble: 'Trouble items', drill: 'Drill', profile: 'Profile', attempt: 'Attempt', recap: 'Monthly recap', rival: 'Rivalry' };

function parseRoute(hash) {
  let h = hash; if (h == null) { try { h = location.hash; } catch (e) { h = ''; } }
  h = String(h || '').replace(/^#\/?/, '');
  if (/access_token|error_description|type=/.test(h)) { ui.route = 'today'; ui.param = null; return; }
  const [r, p] = h.split('/'); ui.route = r || 'today'; ui.param = p || null;
}
/* In-app navigation. Links are handled here rather than by the browser, so the app also works
   inside sandboxed previews where #links and the browser history aren't usable. */
const currentHash = () => '#/' + ui.route + (ui.param ? '/' + ui.param : '');
function applyRoute(hash, fromBack) {
  const prevRoute = ui.route, prevHash = currentHash();
  parseRoute(hash);
  if (!fromBack && currentHash() !== prevHash) { ui.stack.push(prevHash); if (ui.stack.length > 50) ui.stack.shift(); }
  if (ui.route === 'log' && prevRoute !== 'log') ui.log = null;
  if (ui.route === 'admin' && prevRoute !== 'admin') ui.admin.audit = null;
  render();
  try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  const h1 = document.querySelector('#app h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
}
function navigate(hash, fromBack) {
  applyRoute(hash, fromBack);
  try { if (location.hash !== hash) { ui.expectHash = hash; location.hash = hash; } } catch (e) { /* the address can't change here; the app still moves */ }
}
function goBack() { navigate(ui.stack.pop() || '#/today', true); }
window.addEventListener('hashchange', () => {
  if (ui.expectHash && location.hash === ui.expectHash) { ui.expectHash = null; return; }
  ui.expectHash = null; applyRoute(location.hash);
});
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); e.stopPropagation(); navigate(a.getAttribute('href'));
}, true);

      act(async () => {

    case 'admin-active': { const p = state.profilesById[id]; const run = () => act(async () => { await store.adminSetActive(id, !p.active); await loadData(); toast(`${p.initials} ${p.active ? 'deactivated' : 'activated'}`); render(); }); if (p.active) askConfirm(`Deactivate ${p.initials}? They won’t be able to sign in. Their history is kept.`, 'Deactivate', true).then((ok) => ok && run()); else run(); break; }

    case 'format-std': { const f = state.formatsById[id]; act(async () => { await store.updateFormat(id, { is_standard: !f.is_standard }); await loadData(); render(); }); break; }
    case 'format-delete': askConfirm('Delete this format?', 'Delete', true).then((ok) => ok && act(async () => { await store.deleteFormat(id); await loadData(); toast('Format deleted'); render(); })); break;
  }
});
document.addEventListener('change', (e) => {

const ERR_KEY = { 'f-time-min': 'time', 'f-time-sec': 'time', 'f-correct': 'correct', 'f-total': 'correct', 'f-interval': 'interval', 'f-date': 'date', 'f-format': 'format' };

    const display_name = $('#iv-name').value.trim(), initials = $('#iv-ini').value.trim().toUpperCase(), role = $('#iv-role').value;
    if ((!store.isDemo && !/^\S+@\S+\.\S+$/.test(email)) || !display_name || !/^[A-Z0-9]{1,4}$/.test(initials)) { toast('Fill in a valid email, name and 1–4 letter initials.'); return; }
    if (state.profiles.some((p) => p.initials === initials)) { toast(`Initials ${initials} are already used.`); return; }
    act(async () => { await store.adminInvite({ email, display_name, initials, role }); await loadData(); toast(store.isDemo ? `${initials} added` : `Invite sent to ${email}`); render(); });
  } else if (f.id === 'target-form') {

    const val = ev.result_kind === 'time' ? parseTimeInput(raw) : parseFloat(raw);

    const row = { event_id: $('#fm-event').value, name, is_standard: true, item_count: n('#fm-items'), mem_seconds: n('#fm-mem'), interval_seconds: n('#fm-int') };

<script>
'use strict';
/* ================= v2 views: Trouble items, Drill, Profile, Attempt detail, Admin review ================= */
ui.trouble = { family: null, range: 30, sel: null, block: '0', pair: 'SS' };
ui.attemptProof = null;
ui.drill = null;
const BADGE_EMOJI = { first_deck: '🃏', perfect_ten: '🎯', fast_ears: '👂', streak_7: '🔥', streak_30: '📆', streak_100: '💯', decathlete: '🏅', bug_hunter: '🐞', fixed_it: '🔧' };
const DISCIPLINE_EMOJI = { names_faces: '👤', binary: '💻', images: '🖼️', speed_number: '🔢', long_card: '♠️', dates: '📅', long_number: '🧮', words: '📝', spoken: '🎧', speed_card: '⚡' };
const badgeEmoji = (b) => BADGE_EMOJI[b.id] || DISCIPLINE_EMOJI[b.event_id] || '🏅';
const RANKS = ['A', '2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K'];
const SUITS = ['S', 'H', 'D', 'C'];
const SUIT_SYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
const prettyCode = (c) => c.replace(/([AT2-9JQK])([SHDC])/g, (m, r, su) => (r === 'T' ? '10' : r) + SUIT_SYM[su]);

function heatClass(n, max) { if (!n) return ''; if (max <= 2) return n >= 2 ? 'e2' : 'e1'; return n >= max * 0.66 ? 'e3' : n >= max * 0.33 ? 'e2' : 'e1'; }
function heatGrid(codes, cols, data, label = (c) => c) {
  const max = Math.max(1, ...codes.map((c) => data.map[c]?.n || 0));
  return `<div class="heat" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${codes.map((c) => {
    const n = data.map[c]?.n || 0;
    return `<button type="button" class="${heatClass(n, max)}" data-act="trouble-sel" data-code="${esc(c)}" aria-pressed="${ui.trouble.sel === c}" aria-label="${esc(prettyCode(c))}: ${n} error${n === 1 ? '' : 's'}">${esc(label(c))}</button>`;
  }).join('')}</div>`;
}
function viewTrouble() {
  const T = ui.trouble;
  const fams = Object.keys(EMS_FAMILIES).filter((f) => myEms(f));
  if (!fams.length) {
    return `<main class="shell"><header class="topbar"><h1>Trouble items</h1></header>
      <div class="section"><div class="empty">Set up your memory systems in <a href="#/me">Settings</a>, then log the items you get wrong. The ones you miss most show up here.</div></div></main>`;
  }
  if (!T.family || !fams.includes(T.family)) {
    T.family = fams.slice().sort((a, b) => troubleData(myEms(b), 0).items.length - troubleData(myEms(a), 0).items.length)[0];
  }
  if (!T.range) T.range = 30;
  const sys = myEms(T.family); const data = troubleData(sys, T.range);
  let grid = '', sub = '';
  if (sys.kind === 'digits_2') grid = heatGrid(Array.from({ length: 100 }, (_, i) => String(i).padStart(2, '0')), 10, data);
  else if (sys.kind === 'digits_3') {
    const blockN = (b) => Object.values(data.map).filter((r) => r.code[0] === b).reduce((s, r) => s + r.n, 0);
    sub = `<div class="chips" role="group" aria-label="Hundreds block" style="gap:6px">${'0123456789'.split('').map((b) => `<button type="button" class="chip" style="min-height:40px;padding:0 10px" data-act="trouble-block" data-b="${b}" aria-pressed="${T.block === b}">${b}xx${blockN(b) ? ' · ' + blockN(b) : ''}</button>`).join('')}</div>`;
    grid = heatGrid(Array.from({ length: 100 }, (_, i) => T.block + String(i).padStart(2, '0')), 10, data, (c) => c.slice(1));
  } else if (sys.kind === 'cards_1') {
    grid = heatGrid(SUITS.flatMap((su) => RANKS.map((r) => r + su)), 13, data, (c) => c[0] === 'T' ? '10' : c[0]);
    sub = `<div class="tiny muted">Rows: ${SUITS.map((x) => SUIT_SYM[x]).join(' ')}</div>`;
  } else if (sys.kind === 'cards_2') {
    const pairN = (p) => Object.values(data.map).filter((r) => r.code[1] === p[0] && r.code[3] === p[1]).reduce((s, r) => s + r.n, 0);
    sub = `<div class="chips" role="group" aria-label="Suit pair" style="gap:6px">${SUITS.flatMap((a) => SUITS.map((b) => a + b)).map((p) => `<button type="button" class="chip" style="min-height:40px;padding:0 10px" data-act="trouble-pair" data-p="${p}" aria-pressed="${T.pair === p}">${SUIT_SYM[p[0]]}${SUIT_SYM[p[1]]}${pairN(p) ? ' · ' + pairN(p) : ''}</button>`).join('')}</div><div class="tiny muted">Rows: first card A–K · Columns: second card A–K</div>`;
    grid = heatGrid(RANKS.flatMap((r1) => RANKS.map((r2) => r1 + T.pair[0] + r2 + T.pair[1])), 13, data, () => '');
  } else if (sys.kind === 'binary_n') {
    const n = sys.chunk_size || 3;
    if (Math.pow(2, n) <= 64) grid = heatGrid(Array.from({ length: Math.pow(2, n) }, (_, i) => i.toString(2).padStart(n, '0')), n <= 3 ? 4 : 8, data);
    else sub = `<div class="tiny muted">${Math.pow(2, n)} possible codes is too many for a grid, so only the list is shown.</div>`;
  }
  const sel = T.sel && normalizeCode(T.sel, sys) ? T.sel : null;
  let detail = '<div class="tiny muted">Tap a square to see that item and save its image.</div>';
  if (sel) {
    const r = data.map[sel]; const ds = drillStats(sys.id, sel); const lab = imageLabel(sys.id, sel);
    detail = `<div class="card stack" style="gap:10px" aria-live="polite">
      <div style="display:flex;align-items:center;gap:14px"><div class="num" style="font-size:44px;line-height:1">${esc(prettyCode(sel))}</div>
        <div class="grow small">${r ? `${r.n} error${r.n === 1 ? '' : 's'} · last missed ${esc(fmtShort(r.last))} · ${trendOf(r)}` : 'No errors in this range'}${ds.n ? `<br>Drilled ${ds.n}× · recalled ${ds.ok}` : ''}</div></div>
      <form id="label-form" class="field" data-code="${esc(sel)}"><label for="label-input">Your image for ${esc(prettyCode(sel))}</label>
        <div style="display:flex;gap:8px"><input id="label-input" class="input" maxlength="60" value="${esc(lab)}" placeholder="e.g. rocket"><button class="btn" type="submit">Save</button></div></form></div>`;
  }
  const top = data.items.slice(0, 10);
  const list = top.length ? top.map((r) => {
    const tr = trendOf(r); const col = tr === 'worse' ? 'var(--red)' : tr === 'better' ? 'var(--green)' : tr === 'new' ? 'var(--gold-ink)' : 'var(--muted)';
    return `<button type="button" class="list-row" data-act="trouble-sel" data-code="${esc(r.code)}" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;cursor:pointer;color:var(--ink)">
      <span class="num" style="width:64px;font-size:22px;color:var(--red-ink)">${esc(prettyCode(r.code))}</span>
      <span class="grow">${esc(imageLabel(sys.id, r.code)) || '<span class="muted">No image saved</span>'}</span>
      <span class="num" style="font-size:18px">${r.n}</span><span style="width:56px;text-align:right;font-size:13px;font-weight:700;color:${col}">${tr}</span></button>`;
  }).join('') : '<div class="empty">No wrong items logged in this range. Add them when you log an attempt.</div>';
  return `<main class="shell">
    <header class="topbar" style="flex-direction:column;align-items:stretch;gap:10px">
      <h1>Trouble items</h1>
      ${fams.length > 1 ? `<div class="seg" role="group" aria-label="Memory system">${fams.map((f) => `<button type="button" data-act="trouble-fam" data-f="${f}" aria-pressed="${T.family === f}">${EMS_FAMILIES[f].label}</button>`).join('')}</div>` : ''}
      <div class="row-between" style="align-items:center"><span class="tiny muted">${esc(systemLabel(sys))} · ${data.attempts} attempts</span>
        <div class="seg" role="group" aria-label="Date range" style="width:140px">${[[30, '30 d'], [90, '90 d']].map(([n, l]) => `<button type="button" data-act="trouble-range" data-n="${n}" aria-pressed="${T.range === n}">${l}</button>`).join('')}</div></div>
    </header>
    <section class="section stack" style="gap:10px" aria-label="Error heatmap">
      ${sub}${grid}
      ${grid ? '<div class="legend"><span>fewer</span><i style="background:var(--err1)"></i><i style="background:var(--err2)"></i><i style="background:var(--err3)"></i><span>more errors</span></div>' : ''}
      ${detail}
    </section>
    <section class="section"><div class="row-between"><h2>Most missed</h2><span class="tiny muted">errors · trend</span></div>${list}</section>
    ${top.length ? `<div class="section"><button type="button" class="btn primary big" data-act="drill-start">Drill my top ${top.length}</button><p class="tiny muted" style="margin:8px 0 0">See the code, picture your image, then check yourself. Trend compares the recent half of the range with the earlier half.</p></div>` : ''}
  </main>`;
}

function viewDrill() {
  const D = ui.drill; if (!D) return viewTrouble();
  const sys = state.ems.find((s) => s.id === D.sysId); if (!sys) { ui.drill = null; return viewTrouble(); }
  if (D.i >= D.deck.length) {
    const ok = D.results.filter((r) => r.correct).length; const missed = D.results.filter((r) => !r.correct).map((r) => prettyCode(r.item_code));
    return `<main class="shell"><header class="topbar"><h1>Drill done</h1><a href="#/trouble">Close</a></header>
      <section class="section stack"><div class="flashcard"><div class="code">${ok}/${D.results.length}</div><div class="meta">recalled</div></div>
      ${missed.length ? `<p class="small" style="margin:0">Missed: <b>${esc(missed.join(', '))}</b>. They stay near the top of your list.</p>` : '<p class="small" style="margin:0">Clean sweep.</p>'}
      <div class="grid2"><button type="button" class="btn" data-act="drill-again">Drill again</button><a class="btn primary" href="#/trouble">Back to trouble items</a></div></section></main>`;
  }
  const code = D.deck[D.i]; const lab = imageLabel(sys.id, code);
  return `<main class="shell"><header class="topbar"><a href="#/trouble">Stop</a><h1 style="font-size:18px">Drill</h1><span class="small muted">${D.i + 1} / ${D.deck.length}</span></header>
    <section class="section stack">
      <div class="bar" role="img" aria-label="${D.i} of ${D.deck.length} done"><span style="width:${(D.i / D.deck.length) * 100}%"></span></div>
      <div class="flashcard" aria-live="polite"><div class="code">${esc(prettyCode(code))}</div>
        ${D.revealed ? `<div style="font-size:22px;font-weight:700">${lab ? esc(lab) : '<span class="meta">No image saved for this code</span>'}</div>` : '<div class="meta">Picture your image, then reveal</div>'}</div>
      ${D.revealed
        ? `<div class="grid2"><button type="button" class="btn danger big" data-act="drill-answer" data-ok="0">Missed it</button><button type="button" class="btn primary big" data-act="drill-answer" data-ok="1">Knew it</button></div>
           ${lab ? '' : `<form id="drill-label-form" class="field"><label for="drill-label">Save your image for ${esc(prettyCode(code))}</label><div style="display:flex;gap:8px"><input id="drill-label" class="input" maxlength="60"><button class="btn" type="submit">Save</button></div></form>`}`
        : '<button type="button" class="btn primary big" data-act="drill-reveal">Reveal</button>'}
    </section></main>`;
}

function viewProfile() {
  const id = ui.param && state.profilesById[ui.param] ? ui.param : state.me.id;
  const p = state.profilesById[id]; const self = id === state.me.id;
  const lv = xpOf(id); const st = streakInfo(id);
  const earned = Object.fromEntries(state.athleteBadges.filter((b) => b.athlete_id === id).map((b) => [b.badge_id, b]));
  const general = state.badges.filter((b) => !b.kind || b.kind === 'special');
  const badgeCards = general.slice().sort((a, b) => (!!earned[b.id] - !!earned[a.id]) || a.sort_order - b.sort_order).map((b) => {
    const e = earned[b.id];
    return `<div class="badge${e ? '' : ' locked'}"><div class="medal" aria-hidden="true">${badgeEmoji(b)}</div><div class="bname">${esc(b.name)}</div><div class="tiny muted">${esc(badgeDesc(b))}</div>${e ? `<div class="tiny" style="font-weight:600">${esc(fmtShort(e.earned_on))}</div>` : ''}</div>`;
  }).join('');
  const chipLabel = (b) => {
    if (b.kind === 'attempt_count') return `${trimNum(b.threshold)}×`;
    if (b.rule === 'cards_correct') return `${trimNum(b.threshold)}c`;
    if (b.rule === 'time_at_most' || kindOf(b.event_id) === 'time') return b.threshold >= 60 ? fmtTime(b.threshold) : `${trimNum(b.threshold, 2)}s`;
    return trimNum(b.threshold);
  };
  const chip = (b) => { const e = earned[b.id]; const lvl = (b.id.match(/^level_.+_(\d+)$/) || [])[1];
    return `<span class="lchip ${e ? 'tier-' + esc(b.tier || 'gold') : 'locked'}" title="${lvl ? 'Level ' + lvl + ': ' : ''}${esc(badgeDesc(b))}${e ? ' · earned ' + esc(fmtShort(e.earned_on)) : ''}">${esc(chipLabel(b))}<span class="sr">${lvl ? 'Level ' + lvl + ', ' : ''}${esc(badgeDesc(b))}, ${e ? 'earned ' + esc(fmtShort(e.earned_on)) : 'not earned yet'}</span></span>`; };
  // Order chosen by the team for the Discipline levels section
  const DISCIPLINE_ORDER = ['names_faces', 'binary', 'images', 'speed_number', 'long_card', 'dates', 'long_number', 'words', 'spoken', 'speed_card'];
  const ladderEvents = DISCIPLINE_ORDER.map((id) => state.eventsById[id]).filter(Boolean).concat(state.events.filter((e) => !DISCIPLINE_ORDER.includes(e.id)));
  const ladders = ladderEvents.map((ev) => {
    const levels = state.badges.filter((b) => b.event_id === ev.id && b.kind === 'score').sort((a, b) => a.sort_order - b.sort_order);
    const counts = state.badges.filter((b) => b.event_id === ev.id && b.kind === 'attempt_count').sort((a, b) => a.sort_order - b.sort_order);
    if (!levels.length && !counts.length) return '';
    const reached = levels.filter((b) => earned[b.id]).length;
    const next = levels.find((b) => !earned[b.id]);
    return `<div class="ladder"><div class="row-between"><span style="font-weight:700"><span aria-hidden="true">${DISCIPLINE_EMOJI[ev.id] || ''}</span> ${esc(ev.name)}</span><span class="tiny muted">${reached ? 'Level ' + reached : 'Not started'}${next ? ' · next: ' + esc(badgeDesc(next)) : ' · all levels done'}</span></div>
      <div class="ladder-grid">${levels.map(chip).join('')}</div>
      ${counts.length ? `<div class="ladder-counts"><span class="tiny muted">Attempts</span>${counts.map(chip).join('')}</div>` : ''}</div>`;
  }).join('');
  const P = lv.parts;
  return `<main class="shell">
    <header class="hero">
      <div class="row-between" style="align-items:center"><button type="button" class="btn link" data-act="back" style="color:var(--hero-ink)">Back</button>${self ? '<a href="#/me" style="color:var(--hero-ink)">Settings</a>' : ''}</div>
      <div style="display:flex;align-items:center;gap:14px"><div class="avatar" style="width:64px;height:64px;border-radius:32px;font-size:26px">${esc(p.initials)}</div>
        <div><h1>${esc(p.display_name || p.initials)}${self ? ' (you)' : ''}</h1><div class="meta">Rank ${lv.level} · ${st.streak}-day streak · joined ${esc(fmtShort(p.joined_on))}</div></div></div>
      <div class="stack" style="gap:6px"><div class="row-between small"><span>${lv.xp} XP</span><span style="color:var(--hero-muted)">${lv.next - lv.xp} XP to rank ${lv.level + 1}</span></div>
        <div class="bar" role="img" aria-label="${lv.xp} of ${lv.next} XP"><span style="width:${Math.min(100, lv.pct).toFixed(1)}%"></span></div></div>
    </header>
    <section class="section"><div class="grid3">
      <div class="stat"><div class="num">${P.standard + P.oneMin}</div><div class="tiny muted">XP from attempts</div></div>
      <div class="stat"><div class="num">${P.eotw + (P.pool || 0)}</div><div class="tiny muted">from event of the week and team pool</div></div>
      <div class="stat"><div class="num">${P.errors + P.quests}</div><div class="tiny muted">from wrong items and quests</div></div></div>
      <div class="row-between" style="margin-top:8px;align-items:center"><span class="tiny muted">How XP works</span>${infoBtn('xp')}</div>
      <div id="info-xp" class="info-panel" hidden><ul>
        <li>10 XP per attempt in the standard format: 5 min, Long Cards 10 min, Long Numbers 15 min, Speed Card 52 cards, Spoken at 1 s per digit or faster. Up to 5 per discipline a day.</li>
        <li>20 XP per standard attempt in the event of the week.</li>
        <li>5 XP per 1 min Binary, Speed Number, Words or Images attempt. Up to 2 per discipline a day.</li>
        <li>+5 when you log wrong items on an attempt that earned XP.</li>
        <li>+10 for the daily quest.</li>
        <li>A share of the team pool when the team reaches the event-of-the-week target, in proportion to your contribution.</li>
        <li>Other formats, rejected attempts and “didn’t finish” earn no XP.</li></ul></div></section>
    <section class="section"><div class="row-between" style="margin-bottom:10px"><h2>Badges</h2><span class="tiny muted">${Object.keys(earned).length} of ${state.badges.length}</span></div><div class="badges">${badgeCards}</div></section>
    <section class="section"><div class="row-between" style="align-items:center"><h2>Discipline levels</h2>${infoBtn('levels')}</div>
      <div id="info-levels" class="info-panel" hidden><ul>
        <li>Levels 1–20 in each discipline. Each chip shows the score or time needed.</li>
        <li>Bronze 1–5, silver 6–10, gold 11–15, platinum 16–20.</li>
        <li>Counts in the standard format only: 5 min, Long Numbers 15 min, Long Cards 10 min, Spoken at 1 s per digit or faster.</li>
        <li>Speed Card: “c” is cards correct (Levels 1–4); Level 5 is 52/52 within 5:00; after that, 52/52 at or under the time.</li>
        <li>A result flagged for review earns its levels once an admin verifies it.</li></ul></div>
      ${ladders}</section>
    ${self || isAdmin() ? notesSection(id, null) : ''}
    ${self ? '' : `<div class="section">${state.me.rival_id === id ? `<a class="btn big" href="#/rival">Head-to-head this month</a>` : `<button type="button" class="btn big" data-act="set-rival" data-id="${esc(id)}">Make ${esc(p.initials)} my rival</button>`}</div>`}
  </main>`;
}

function viewAttempt() {

  if (!a) return `<main class="shell"><header class="topbar"><button type="button" class="btn link" data-act="back">Back</button></header><div class="section"><div class="empty">That attempt doesn’t exist any more.</div></div></main>`;

  const errs = state.errorsByAttempt[a.id] || [];

  const comments = commentsOf(a.id);
  const flags = (a.flags || []).filter((x) => FLAG_LABELS[x]);
  return `<main class="shell">
    <header class="topbar"><button type="button" class="btn link" data-act="back">Back</button><h1 style="font-size:18px">${esc(ev.name)}</h1>${canEdit(a) ? `<a href="#/log/${esc(a.id)}">Edit</a>` : '<span></span>'}</header>

        <div class="grow"><div style="font-weight:700">${esc(nameOf(a.athlete_id))}</div><div class="tiny muted">${esc(fmtLong(a.practiced_on))} · attempt ${a.seq || 1} · ${esc(f ? f.name : '')}</div></div>${kudosBtn(a)}</div>

      ${flags.length && (own || isAdmin()) ? `<div class="notice"><b>Why it’s flagged for review</b><ul class="flag-list">${flags.map((x) => `<li>${esc(FLAG_LABELS[x])}</li>`).join('')}</ul></div>` : ''}
      ${a.note ? `<p style="margin:0">${esc(a.note)}</p>` : ''}
      ${errs.length ? `<div><div class="tiny muted">Wrong items</div><div class="chips" style="gap:6px;margin-top:4px">${errs.map((e) => `<span class="code-chip" style="padding-right:10px">${esc(prettyCode(e.item_code))}</span>`).join('')}</div></div>` : ''}
    </section>
    <section class="section stack" style="gap:10px">
      ${a.proof_path ? `<button type="button" class="btn" data-act="view-proof" data-id="${esc(a.id)}">${ICONS.photo}View GAMA screenshot</button>` : ''}
      ${!a.proof_path && canAddProof(a) ? `<div class="card stack" style="gap:8px">${proofRequested(a) ? '<div class="small"><b>New personal best in a standard format.</b> Add your GAMA screenshot to confirm it.</div>' : '<div class="small">Add your GAMA screenshot (optional).</div>'}
        ${proofPicker('proof-file', ui.attemptProof, 'attempt')}<button type="button" class="btn primary" data-act="proof-upload" data-id="${esc(a.id)}"${ui.attemptProof ? '' : ' disabled'}>Upload screenshot</button></div>` : ''}
      ${isAdmin() ? `<div class="grid3">${a.status !== 'verified' ? `<button type="button" class="btn primary" data-act="attempt-status" data-s="verified" data-id="${esc(a.id)}">Verify</button>` : '<span></span>'}${a.status !== 'rejected' ? `<button type="button" class="btn danger" data-act="attempt-status" data-s="rejected" data-id="${esc(a.id)}">Reject</button>` : `<button type="button" class="btn" data-act="attempt-status" data-s="self_reported" data-id="${esc(a.id)}">Restore</button>`}</div>` : ''}
      ${ghostBox(a.athlete_id, a.format_id, a.id, a.practiced_on)}
    </section>
    ${own || isAdmin() ? notesSection(a.athlete_id, a.id) : ''}
    <section class="section"><h2>Comments</h2>
      ${comments.map((c) => `<div class="comment"><div class="row-between"><span><b>${esc(nameOf(c.author_id))}</b> <span class="tiny muted">${esc(new Date(c.created_at).toLocaleString('en-SG', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</span></span>${c.author_id === state.me.id || isAdmin() ? `<button type="button" class="btn link tiny" data-act="comment-delete" data-id="${esc(c.id)}">Delete</button>` : ''}</div><div style="white-space:pre-wrap">${esc(c.body)}</div></div>`).join('') || '<p class="small muted" style="margin:6px 0">No comments yet.</p>'}
      <form id="comment-form" class="field" data-id="${esc(a.id)}" style="margin-top:10px"><label for="comment-body" class="sr">Add a comment</label>
        <textarea id="comment-body" class="input" rows="2" maxlength="500" placeholder="Say something nice, or ask how they did it"></textarea>
        <div><button class="btn primary" type="submit">Post</button></div></form>
    </section>
  </main>`;
}

const infoBtn = (k) => `<button type="button" class="info-btn" data-act="toggle-info" data-k="${k}" aria-expanded="false" aria-controls="info-${k}" aria-label="How this works">i</button>`;
/* Admin: review queue, badge thresholds, verification settings */
function adminReview(pending) {
  if (!pending.length) return '<div class="empty">Nothing waiting for review. Results that beat the team best, jump sharply, arrive in bursts, are backdated or are edited after logging appear here.</div>';
  return pending.slice().sort((a, b) => (b.logged_at || '').localeCompare(a.logged_at || '')).map((a) => `<div class="card stack" style="gap:8px;margin-bottom:10px">
    <div class="row-between" style="align-items:center"><div><b>${esc(nameOf(a.athlete_id))}</b> · ${esc(state.eventsById[a.event_id]?.name || '')} <span class="tiny muted">${esc(fmtName(a.format_id))} · ${esc(fmtShort(a.practiced_on))}</span></div><div class="big-val">${esc(fmtResult(a))}</div></div>
    <ul class="flag-list">${(a.flags || []).filter((x) => FLAG_LABELS[x]).map((x) => `<li>${esc(FLAG_LABELS[x])}</li>`).join('') || '<li>Flagged</li>'}</ul>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${a.proof_path ? `<button type="button" class="btn sm" data-act="view-proof" data-id="${esc(a.id)}">${ICONS.photo}Screenshot</button>` : '<span class="tiny muted" style="align-self:center">No screenshot</span>'}
      <a class="btn sm" href="#/attempt/${esc(a.id)}">Open</a>
      <button type="button" class="btn sm primary" data-act="attempt-status" data-s="verified" data-id="${esc(a.id)}">Verify</button>
      <button type="button" class="btn sm danger" data-act="attempt-status" data-s="rejected" data-id="${esc(a.id)}">Reject</button></div></div>`).join('');
}
function adminBadges() {
  const row = (b) => `<tr><td><label class="sr" for="bn-${b.id}">Name</label><input id="bn-${b.id}" class="input" style="min-height:40px;min-width:160px" value="${esc(b.name)}" maxlength="40"></td><td style="white-space:normal;min-width:190px">${esc(badgeDesc(b))}${b.tier ? ` <span class="tag tier-${esc(b.tier)}">${esc(b.tier)}</span>` : ''}</td>
      <td>${b.threshold != null ? `<label class="sr" for="bt-${b.id}">Threshold</label><input id="bt-${b.id}" class="input" style="min-height:40px;width:90px" inputmode="decimal" value="${esc(trimNum(b.threshold, 2))}">${b.rule === 'time_at_most' ? '<div class="tiny muted">seconds</div>' : b.rule === 'cards_correct' ? '<div class="tiny muted">cards</div>' : ''}` : '–'}</td>
      <td>${b.threshold2 != null ? `<label class="sr" for="bt2-${b.id}">Second threshold</label><input id="bt2-${b.id}" class="input" style="min-height:40px;width:90px" inputmode="decimal" value="${esc(trimNum(b.threshold2, 2))}"><div class="tiny muted">s per digit</div>` : '–'}</td>
      <td><button type="button" class="btn sm" data-act="badge-save" data-id="${b.id}">Save</button></td></tr>`;
  const table = (list) => `<div class="table-wrap"><table><thead><tr><th>Badge</th><th>Rule</th><th>Threshold</th><th>Second</th><th><span class="sr">Save</span></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>`;
  const groups = [['General', state.badges.filter((b) => !b.kind || b.kind === 'special')]].concat(state.events.map((e) => [e.name, state.badges.filter((b) => b.event_id === e.id && b.kind && b.kind !== 'special')]));
  return `<p class="small muted" style="margin:0 0 12px">Levels follow the team’s benchmark table. Changing a threshold doesn’t take away badges already earned. Speed Card Levels 1–4 are cards correct; Levels 5–20 are 52/52 times in seconds.</p>
    ${groups.filter(([, l]) => l.length).map(([name, l], i) => `<details class="card" style="margin-bottom:10px"${i === 0 ? ' open' : ''}><summary style="cursor:pointer;font-weight:700;min-height:28px">${esc(name)} <span class="tiny muted">(${l.length})</span></summary><div style="margin-top:10px">${table(l.sort((a, b) => a.sort_order - b.sort_order))}</div></details>`).join('')}`;
}
function adminSettings() {
  return `<form id="settings-form" class="card stack" novalidate><h2>Rules and goals</h2><p class="small muted" style="margin:0">Review thresholds are draft values from the design doc (§9). Flagged results go to the Review tab and show as unverified until you verify or reject them.</p>
    ${Object.entries(SETTING_LABELS).map(([k, [label, unit]]) => `<div class="field"><label for="st-${k}">${esc(label)}</label><div class="unit-wrap"><input id="st-${k}" class="input" style="max-width:120px" inputmode="decimal" value="${esc(trimNum(state.settings[k], 2))}"><span>${esc(unit)}</span></div></div>`).join('')}
    <div><button class="btn primary" type="submit">Save rules</button></div></form>`;
}

function takePastedImage(file, scope) {
  if (!file || !file.type.startsWith('image/')) { toast('That isn’t an image.'); return; }
  if (scope === 'log' && ui.log) { syncLog(); ui.log.file = file; } else ui.attemptProof = file;
  render(); toast('Screenshot ready to attach');
}
document.addEventListener('paste', (e) => {
  const onLog = ui.route === 'log' && ui.log; const onAttempt = ui.route === 'attempt' && document.getElementById('proof-file');
  if (!onLog && !onAttempt) return;
  const items = [...((e.clipboardData && e.clipboardData.items) || [])];
  const img = items.find((i) => i.kind === 'file' && i.type.startsWith('image/'));
  if (!img) { if (e.target.classList && e.target.classList.contains('paste-target')) { e.preventDefault(); toast('Paste a screenshot image here.'); } return; }
  e.preventDefault(); takePastedImage(img.getAsFile(), onLog ? 'log' : 'attempt');
});
/* ---------------- v2 events ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const id = el.dataset.id; const T = ui.trouble;
  switch (el.dataset.act) {
    case 'back': goBack(); break;
    case 'toggle-info': { const panel = document.getElementById('info-' + el.dataset.k); if (panel) { panel.hidden = !panel.hidden; el.setAttribute('aria-expanded', String(!panel.hidden)); } break; }
    case 'proof-clear': if (el.dataset.scope === 'log' && ui.log) { syncLog(); ui.log.file = null; } else ui.attemptProof = null; render(); break;
    case 'proof-paste': {
      const scope = el.dataset.scope;
      (async () => {
        try {
          const items = await navigator.clipboard.read();
          for (const it of items) { const type = it.types.find((t) => t.startsWith('image/')); if (type) { const blob = await it.getType(type); takePastedImage(new File([blob], 'pasted-screenshot.' + type.split('/')[1], { type }), scope); return; } }
          toast('No image on the clipboard. Copy the screenshot first.');
        } catch (e) { toast('Paste isn’t allowed here. Tap and hold the box below and choose Paste, or use Choose file.'); }
      })();
      break;
    }
    case 'trouble-fam': T.family = el.dataset.f; T.sel = null; render(); break;
    case 'trouble-range': T.range = +el.dataset.n; render(); break;
    case 'trouble-sel': T.sel = el.dataset.code; render(); break;
    case 'trouble-block': T.block = el.dataset.b; render(); break;
    case 'trouble-pair': T.pair = el.dataset.p; render(); break;
    case 'drill-start': case 'drill-again': {
      const sys = myEms(T.family); if (!sys) break;
      const deck = troubleData(sys, T.range).items.slice(0, 10).map((r) => r.code);
      for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
      ui.drill = { sysId: sys.id, deck, i: 0, revealed: false, results: [] };
      navigate('#/drill');
      break;
    }
    case 'drill-reveal': ui.drill.revealed = true; render(); break;
    case 'drill-answer': {
      const D = ui.drill; const row = { ems_system_id: D.sysId, item_code: D.deck[D.i], correct: el.dataset.ok === '1', day: TODAY() };
      D.results.push(row); D.i++; D.revealed = false;
      act(async () => {
        await store.recordDrill([row]);
        state.drills.push({ ...row, athlete_id: state.me.id, at: new Date().toISOString() }); state.memo = {};
        if (D.i >= D.deck.length) await syncAwards();
        render();
      });
      break;
    }
    case 'profile-progress': ui.progress.athleteId = id; ui.progress.eventId = null; ui.progress.formatId = null; navigate('#/progress'); break;
    case 'proof-upload': {
      const file = ui.attemptProof; if (!file) { toast('Choose or paste a screenshot first.'); break; }
      act(async () => { const path = await store.uploadProof(id, file); await store.updateAttempt(id, { proof_path: path }); ui.attemptProof = null; await loadData(); toast('Screenshot added'); render(); });
      break;
    }
    case 'attempt-status': act(async () => { await store.setStatus(id, el.dataset.s); await loadData(); toast({ verified: 'Verified', rejected: 'Rejected', self_reported: 'Restored' }[el.dataset.s]); render(); }); break;
    case 'comment-delete': askConfirm('Delete this comment?', 'Delete', true).then((ok) => ok && act(async () => { await store.deleteComment(id); await loadData(); render(); })); break;
    case 'comments-read': act(async () => { await store.updateProfile({ comments_seen_at: new Date().toISOString() }); await loadData(); render(); }); break;
    case 'badge-save': {
      const b = state.badges.find((x) => x.id === id); const patch = { name: $('#bn-' + id).value.trim() || b.name };
      const t1 = $('#bt-' + id), t2 = $('#bt2-' + id);
      if (t1) { const v = Number(t1.value); if (!(v > 0)) { toast('Threshold must be a positive number.'); break; } patch.threshold = v; }
      if (t2) { const v = Number(t2.value); if (!(v > 0)) { toast('Second threshold must be a positive number.'); break; } patch.threshold2 = v; }
      act(async () => { await store.updateBadge(id, patch); await loadData(); toast('Badge saved'); render(); });
      break;
    }
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.id === 'comment-form') {
    const body = $('#comment-body').value.trim(); if (!body) return;
    act(async () => { await store.addComment(f.dataset.id, body.slice(0, 500)); await loadData(); render(); });
  } else if (f.id === 'label-form' || f.id === 'drill-label-form') {
    const sysId = f.id === 'label-form' ? myEms(ui.trouble.family).id : ui.drill.sysId;
    const code = f.id === 'label-form' ? f.dataset.code : ui.drill.deck[ui.drill.i];
    const label = (f.id === 'label-form' ? $('#label-input') : $('#drill-label')).value.trim();
    act(async () => { await store.saveEmsItem(sysId, code, label); await loadData(); toast(label ? 'Image saved' : 'Image removed'); render(); });
  } else if (f.id === 'settings-form') {
    const obj = {};
    for (const k of Object.keys(SETTING_LABELS)) { const v = Number($('#st-' + k).value); if (!(v >= 0)) { toast('Each rule needs a number.'); return; } obj[k] = v; }
    act(async () => { await store.saveSettings(obj); await loadData(); toast('Rules saved'); render(); });
  }
});
</script>
<script>
'use strict';
/* ================= v3 views: coach notes, monthly recap, rivalry, admin seasons and export ================= */
function notesSection(athleteId, attemptId) {
  const list = notesFor(athleteId).filter((n) => (attemptId ? n.attempt_id === attemptId : true));
  const canAdd = isAdmin() && athleteId !== state.me.id;
  if (!list.length && !canAdd) return '';
  const ws = weekStart(TODAY());
  return `<section class="section"><h2 style="margin-bottom:4px">${attemptId ? 'Coach note' : 'Coach notes'}</h2>
    ${list.map((n) => `<div class="comment" style="border-left:4px solid var(--gold);padding-left:10px">
      <div style="white-space:pre-wrap">${esc(n.body)}</div>
      <div class="tiny muted" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${esc(nameOf(n.author_id))} · ${esc(fmtShort(n.created_at.slice(0, 10)))}${!attemptId && n.attempt_id && attemptById(n.attempt_id) ? ` · <a href="#/attempt/${esc(n.attempt_id)}">${esc(state.eventsById[attemptById(n.attempt_id).event_id]?.name || 'attempt')}</a>` : ''}${n.week_start ? ` · week of ${esc(fmtShort(n.week_start))}` : ''}

function defaultRecapMonth() { const t = TODAY(); return +t.slice(8, 10) <= 7 ? shiftMonth(t.slice(0, 7), -1) : t.slice(0, 7); }
function recapText(r) {
  const parts = [`Team SG training, ${monthName(r.month)}: ${r.attempts} attempts on ${r.days} days`, `${r.pbs} personal best${r.pbs === 1 ? '' : 's'}`, `${r.targets} target${r.targets === 1 ? '' : 's'} hit`];
  if (r.best) parts.push(`best event ${r.best.name} (${r.best.text})`);
  if (r.improved) parts.push(`most improved ${r.improved.name} (${r.improved.text})`);
  if (r.fixed) parts.push(`${r.fixed} trouble item${r.fixed > 1 ? 's' : ''} fixed`);
  if (r.badges.length) parts.push(`badges: ${r.badges.join(', ')}`);
  return parts.join(', ') + '.';
}
function viewRecap() {

      <div style="display:flex;gap:4px"><button type="button" class="btn sm" data-act="recap-month" data-m="${shiftMonth(month, -1)}" aria-label="Previous month">‹</button><button type="button" class="btn sm" data-act="recap-month" data-m="${shiftMonth(month, 1)}" aria-label="Next month"${month >= cur ? ' disabled' : ''}>›</button></div></header>
    <section class="section"><div class="hero" style="border-radius:14px;gap:18px">

      <div class="recap-grid">${stat(r.attempts, 'attempts')}${stat(r.days, 'training days')}${stat(r.longest, 'longest run of days')}${stat(r.pbs, 'personal bests')}${stat(r.targets, 'targets hit')}${stat(r.xp, 'XP earned')}</div>

      ${r.fixed != null ? line('Trouble items fixed', `${r.fixed} <span class="muted" style="font-weight:400">· missed twice or more in the 60 days before, not this month</span>`) : ''}
      ${line('Badges earned', r.badges.length ? esc(r.badges.join(', ')) : '–')}
      ${line('Events trained', r.events)}
    </section>
    ${r.attempts ? `<div class="section stack"><button type="button" class="btn primary big" data-act="recap-image" data-m="${month}">Create share image</button><button type="button" class="btn" data-act="recap-copy" data-m="${month}">Copy summary text</button></div>` : '<div class="section"><div class="empty">No attempts this month.</div></div>'}
  </main>`;
}
async function recapCanvas(r) {
  const W = 1080, H = 1350; const c = document.createElement('canvas'); c.width = W; c.height = H; let g = null; try { g = c.getContext('2d'); } catch (e) { g = null; }
  if (!g) throw new Error('This browser can’t create images. Use Copy summary text instead.');
  try { await Promise.all([document.fonts.load('700 120px "Barlow Condensed"'), document.fonts.load('600 40px "Source Sans 3"')]); } catch (e) { /* fallback fonts */ }
  const NUM = '"Barlow Condensed", "Arial Narrow", sans-serif', BODY = '"Source Sans 3", Arial, sans-serif';
  const fit = (text, font, max) => { g.font = font; let t = String(text); while (g.measureText(t).width > max && t.length > 4) t = t.slice(0, -2) + '…'; return t; };
  g.fillStyle = '#1B2A41'; g.fillRect(0, 0, W, H); g.fillStyle = '#C8102E'; g.fillRect(0, 0, W, 18);
  g.fillStyle = '#C9D1DC'; g.font = `600 34px ${BODY}`; g.fillText('TEAM SG MEMORY TRAINING', 80, 112);
  g.fillStyle = '#FFFFFF'; g.fillText(fit(monthName(r.month).toUpperCase(), `700 130px ${NUM}`, W - 160), 80, 250);
  g.fillStyle = '#C9A227'; g.fillText(fit(state.me.display_name || state.me.initials, `600 48px ${BODY}`, W - 160), 80, 322);
  const stats = [[r.attempts, 'attempts'], [r.days, 'training days'], [r.longest, 'longest run'], [r.pbs, 'personal bests'], [r.targets, 'targets hit'], [r.xp, 'XP earned']];
  stats.forEach(([n, l], i) => {
    const x = 80 + (i % 3) * 320, y = 520 + Math.floor(i / 3) * 230;
    g.fillStyle = '#C9A227'; g.font = `700 140px ${NUM}`; g.fillText(String(n), x, y);
    g.fillStyle = '#C9D1DC'; g.font = `600 34px ${BODY}`; g.fillText(l, x, y + 48);
  });
  const lines = [['Best event', r.best ? `${r.best.name} · ${r.best.text}` : '–'], ['Most improved', r.improved ? `${r.improved.name} · ${r.improved.text}` : '–']];
  if (r.fixed) lines.push(['Trouble items fixed', String(r.fixed)]);
  if (r.badges.length) lines.push(['Badges', r.badges.join(', ')]);
  lines.slice(0, 4).forEach(([l, v], i) => {
    const y = 1000 + i * 82;
    g.fillStyle = '#C9D1DC'; g.font = `600 30px ${BODY}`; g.fillText(l, 80, y);
    g.fillStyle = '#FFFFFF'; g.fillText(fit(v, `700 38px ${BODY}`, W - 460), 380, y);
  });
  g.fillStyle = '#C8102E'; g.fillRect(80, H - 110, 120, 8);
  return c;
}

const rotationEvent = (ws) => { const evs = eotwPool(); const i = Math.floor(diffDays(ROTATION_ANCHOR, ws) / 7); return evs[((i % evs.length) + evs.length) % evs.length]; };
function adminSeasons() {
  const today = TODAY(); const ws0 = weekStart(today);
  const status = (s) => (s.competition_on < today ? 'Past' : s.starts_on > today ? 'Upcoming' : 'Live');
  return `<form id="season-form" class="card stack" novalidate><h2>Add a season</h2><p class="small muted" style="margin:0">A season runs from its start date to the competition. While it’s live, Today shows a countdown and Boards gets a Season tab.</p>
      <div class="grid2"><div class="field" style="grid-column:1/-1"><label for="se-name">Name</label><input id="se-name" class="input" maxlength="60" placeholder="e.g. SNMC 2027"></div>
      <div class="field"><label for="se-start">Season starts</label><input id="se-start" class="input" type="date" value="${today}"></div>
      <div class="field"><label for="se-comp">Competition day</label><input id="se-comp" class="input" type="date"></div></div>

    <div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Season</th><th>Starts</th><th>Competition</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>
      ${state.seasons.length ? state.seasons.map((s) => `<tr><td>${esc(s.name)}</td><td>${esc(fmtShort(s.starts_on))} ${s.starts_on.slice(0, 4)}</td><td>${esc(fmtShort(s.competition_on))} ${s.competition_on.slice(0, 4)}</td><td>${status(s)}</td><td><button type="button" class="btn sm danger" data-act="season-delete" data-id="${esc(s.id)}">Delete</button></td></tr>`).join('') : '<tr><td colspan="5" class="muted">No seasons yet.</td></tr>'}
    </tbody></table></div>
    <div class="card stack" style="margin-top:14px"><h2>Event of the week</h2><p class="small muted" style="margin:0">Attempts in this event earn double XP for the week, and the team works toward a shared target for an XP pool. Left on Auto, the event rotates in order (never Long Cards or Long Numbers) and the target alternates between correct items and attempts in a shuffled order. Target sizes and the pool are in Settings.</p>
      ${[0, 1, 2, 3].map((k) => { const ws = addDays(ws0, k * 7); const pick = state.weeklyEvents.find((w) => w.week_start === ws);
        const autoType = (() => { const idx = Math.floor(diffDays(ROTATION_ANCHOR, ws) / 7); return seededShuffle(['items', 'attempts'], 'pool|' + Math.floor(idx / 2))[((idx % 2) + 2) % 2]; })();
        const tLabel = (t) => (t === 'items' ? 'Correct items' : 'Attempts');

          <div class="field"><label for="eotwt-${ws}">Team target</label><select id="eotwt-${ws}" class="input" data-week-target="${ws}">${opt('', `Auto (${tLabel(autoType)})`, !(pick && pick.target_type))}${['items', 'attempts'].map((t) => opt(t, tLabel(t), pick && pick.target_type === t)).join('')}</select></div></div>`; }).join('')}

let csvUrl = null;
function showCSV(filename, text) {
  if (csvUrl) try { URL.revokeObjectURL(csvUrl); } catch (e) { /* ignore */ }
  try { csvUrl = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' })); } catch (e) { csvUrl = null; }
  ui.csvText = text;
  const rows = text.split('\r\n').length - 1;
  openModal(`<h2 id="modal-title" style="margin:0 0 4px">${esc(filename)}</h2><p class="small muted" style="margin:0 0 10px">${rows} row${rows === 1 ? '' : 's'}</p>
    <label class="sr" for="csv-text">CSV content</label><textarea id="csv-text" class="input" rows="7" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre;overflow:auto">${esc(text.length > 30000 ? text.slice(0, 30000) + '\n…' : text)}</textarea>
    <div class="grid3" style="margin-top:12px">${csvUrl ? `<a class="btn primary" href="${csvUrl}" download="${esc(filename)}">Download</a>` : '<span></span>'}<button type="button" class="btn" data-act="csv-copy">Copy</button><button type="button" class="btn" data-modal="close">Close</button></div>`, () => {});
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  try { const ta = el || Object.assign(document.createElement('textarea'), { value: text }); if (!el) document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); if (!el) ta.remove(); return ok; } catch (e) { return false; }
}

/* ---------------- v3 events ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const id = el.dataset.id; const today = TODAY();
  switch (el.dataset.act) {
    case 'log-preset': ui.logPreset = id; ui.log = null; navigate('#/log'); break;
    case 'set-rival': act(async () => { await store.updateProfile({ rival_id: id }); await loadData(); toast(`${initialsOf(id)} is your rival`); navigate('#/rival'); }); break;
    case 'recap-month': navigate('#/recap/' + el.dataset.m); break;
    case 'rival-month': navigate('#/rival/' + el.dataset.m); break;
    case 'recap-copy': { const r = recapFor(state.me.id, el.dataset.m); copyText(recapText(r)).then((ok) => toast(ok ? 'Summary copied' : 'Copy isn’t allowed here')); break; }
    case 'recap-image': act(async () => {
      const r = recapFor(state.me.id, el.dataset.m); const c = await recapCanvas(r); const url = c.toDataURL('image/png');
      ui.recapFile = null; try { ui.recapFile = await new Promise((res) => c.toBlob((b) => res(b ? new File([b], `teamsg-recap-${r.month}.png`, { type: 'image/png' }) : null), 'image/png')); } catch (err) { /* ignore */ }
      ui.recapSummary = recapText(r);
      const canShare = ui.recapFile && navigator.canShare && navigator.canShare({ files: [ui.recapFile] });
      openModal(`<h2 id="modal-title" style="margin:0 0 12px">${esc(monthName(r.month))} recap</h2><img src="${url}" alt="Recap image: ${esc(recapText(r))}">
        <div class="grid3"><a class="btn primary" href="${url}" download="teamsg-recap-${r.month}.png">Download</a>${canShare ? '<button type="button" class="btn" data-act="recap-share">Share</button>' : '<span></span>'}<button type="button" class="btn" data-modal="close">Close</button></div>
        <p class="tiny muted" style="margin:10px 0 0">On a phone you can also press and hold the image to save it.</p>`, () => {});
    }); break;
    case 'recap-share': if (ui.recapFile) navigator.share({ files: [ui.recapFile], text: ui.recapSummary }).catch(() => {}); break;
    case 'export-mine': showCSV(`teamsg-${state.me.initials}-history-${today}.csv`, attemptsCSV(attemptsOf(state.me.id))); break;
    case 'export': {
      const w = el.dataset.what;
      if (w === 'attempts') showCSV(`teamsg-attempts-${today}.csv`, attemptsCSV(state.attempts));

    case 'season-delete': askConfirm('Delete this season?', 'Delete', true).then((ok) => ok && act(async () => { await store.deleteSeason(id); await loadData(); toast('Season deleted'); render(); })); break;
    case 'note-delete': askConfirm('Delete this coach note?', 'Delete', true).then((ok) => ok && act(async () => { await store.deleteCoachNote(id); await loadData(); render(); })); break;
  }
});
document.addEventListener('change', (e) => {
